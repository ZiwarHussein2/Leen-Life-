# Production-shaped Compose stack. PostgreSQL, Redis, MinIO, and the
# worker live on a private network only; the reverse proxy is the sole
# public entry point. Real deployments must supply secrets via an env
# file or secret manager — never commit them.
name: leenlife

services:
  proxy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks: [public, private]
    depends_on: [web, api]
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
    environment:
      API_BASE_URL: http://api:3001
    networks: [private]
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    env_file: [.env.production]
    environment:
      DATABASE_URL: postgresql://leenlife:${POSTGRES_PASSWORD}@postgres:5432/leenlife?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_DIR: /storage
      AUTH_DEV_MODE: "false"
    volumes:
      - file-storage:/storage
    networks: [private]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.worker
    env_file: [.env.production]
    environment:
      DATABASE_URL: postgresql://leenlife:${POSTGRES_PASSWORD}@postgres:5432/leenlife?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_DIR: /storage
    volumes:
      - file-storage:/storage
    networks: [private]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leenlife
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: leenlife
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leenlife"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    networks: [private]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    networks: [private]
    restart: unless-stopped

networks:
  public: {}
  private:
    internal: false # set true once the proxy handles all egress

volumes:
  caddy-data:
  postgres-data:
  redis-data:
  minio-data:
  file-storage:
